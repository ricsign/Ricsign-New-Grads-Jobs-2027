# ============================================================================
# THE COMPANY BAR
# ----------------------------------------------------------------------------
# This file is the product. Everything downstream is plumbing.
#
# A company is in this registry only if a strong CS candidate would take the
# interview without being asked twice. That is a deliberately high, subjective,
# and *auditable* bar - see docs/COMPANY_BAR.md for the written criteria and
# the explicit exclusion list.
#
# Every `token` below was fetched live against its ATS before being committed.
# `verified_at` records when. Adapters assert non-empty responses, because a
# board can return HTTP 200 with zero postings (see the `enabled: false`
# entries) and a naive 200-check would silently scrape nothing forever.
#
# tier 0  Frontier AI lab or equivalent. Research-defining work, comp at the
#         very top of the market, hiring bar to match.
# tier 1  Established elite. FAANG+, top quant/HFT, category-leading scale-ups.
# tier 2  Strong specialist or earlier-stage company with a real engineering
#         reputation. Included, but ranked below tiers 0 and 1 everywhere.
# ============================================================================

