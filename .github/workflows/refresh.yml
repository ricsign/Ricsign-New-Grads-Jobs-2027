name: Refresh boards

# Every 6 hours. Runs on GitHub's runners, which have the open network egress
# the ATS APIs require.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent board fetches"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh every board
        id: refresh
        run: python -m eliteboard.cli refresh --workers "${{ github.event.inputs.workers || 12 }}"

      - name: Summarize into the run page
        if: always()
        run: |
          {
            echo "## Refresh summary"
            echo
            if [ -f data/v1/stats.json ]; then
              python - <<'PY'
          import json, pathlib
          s = json.loads(pathlib.Path("data/v1/stats.json").read_text())
          h = s.get("pipeline_health", {})
          f = s.get("freshness", {})
          print(f"- **{s['live_roles']} live roles** across {s['companies_with_open_roles']} companies")
          print(f"- Boards: {h.get('boards_ok')} ok / {h.get('boards_empty')} empty / {h.get('boards_failed')} failed")
          print(f"- Sponsorship resolved on **{s['sponsorship_resolved_pct']}%** of rows")
          print(f"- Median age {f.get('median_age_days')}d · verified in last 24h: {f.get('verified_within_24h')}")
          print()
          print("| Track | Roles |")
          print("|:--|--:|")
          for k, v in s["by_track"].items():
              print(f"| {k} | {v} |")
          if h.get("failures"):
              print()
              print("### Failed boards")
              for x in h["failures"]:
                  print(f"- `{x['company']}` ({x['ats']}): {x['error']}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boards data CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          COUNT=$(python -c "import json;print(json.load(open('data/v1/stats.json'))['live_roles'])")
          git commit -m "data: refresh boards ($COUNT live roles)"
          git push
